<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Knot Control Room component map</title>
  <desc id="desc">AppGate uses ApplicationProvider and KnotController, which coordinate infrastructure clients and compose the Control Room from navigation, conversation list, workspace panes and Inspector.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#69717D"/>
    </marker>
  </defs>
  <rect width="1200" height="620" rx="24" fill="#0C0D0F"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="48" y="58" fill="#F7F8FA" font-size="40" font-weight="720">Control Room components</text>
    <text x="48" y="88" fill="#A6ADB7" font-size="20">React renders one controller snapshot; components stay focused on interaction and composition.</text>
  </g>
  <g fill="#A6ADB7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="1.2">
    <text x="48" y="136">APPLICATION BOUNDARY</text>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="48" y="158" width="200" height="82" rx="16" fill="#17191D" stroke="#343940"/>
    <text x="68" y="191" fill="#F7F8FA" font-size="22" font-weight="680">AppGate</text>
    <text x="68" y="218" fill="#A6ADB7" font-size="18">restore + redirect</text>
    <rect x="286" y="158" width="250" height="82" rx="16" fill="#17191D" stroke="#343940"/>
    <text x="306" y="191" fill="#F7F8FA" font-size="22" font-weight="680">ApplicationProvider</text>
    <text x="306" y="218" fill="#A6ADB7" font-size="18">external store bridge</text>
    <rect x="574" y="158" width="246" height="82" rx="16" fill="#17191D" stroke="#343940"/>
    <text x="594" y="191" fill="#F7F8FA" font-size="22" font-weight="680">KnotController</text>
    <text x="594" y="218" fill="#A6ADB7" font-size="18">state + orchestration</text>
    <rect x="858" y="158" width="294" height="82" rx="16" fill="#17191D" stroke="#343940"/>
    <text x="878" y="191" fill="#F7F8FA" font-size="22" font-weight="680">Infrastructure clients</text>
    <text x="878" y="218" fill="#A6ADB7" font-size="18">API · Gateway · Presence · files</text>
  </g>
  <g fill="none" stroke="#69717D" stroke-width="2" marker-end="url(#arrow)">
    <path d="M250 199H278"/>
    <path d="M538 199H566"/>
    <path d="M822 199H850"/>
  </g>
  <path d="M411 242V284" fill="none" stroke="#69717D" stroke-width="2" marker-end="url(#arrow)"/>
  <g fill="#A6ADB7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="1.2">
    <text x="48" y="288">RESPONSIVE SHELL</text>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="48" y="310" width="1104" height="262" rx="16" fill="#17191D" stroke="#343940"/>
    <text x="70" y="344" fill="#F7F8FA" font-size="24" font-weight="700">ControlRoom</text>
    <text x="246" y="344" fill="#A6ADB7" font-size="18">section routing · responsive visibility · inspector state</text>

    <rect x="70" y="370" width="172" height="168" rx="16" fill="#24272C"/>
    <text x="88" y="403" fill="#F7F8FA" font-size="20" font-weight="680">NavigationRail</text>
    <text x="88" y="432" fill="#A6ADB7" font-size="17">Chats</text>
    <text x="88" y="456" fill="#A6ADB7" font-size="17">Wiretap · Wall</text>
    <text x="88" y="480" fill="#A6ADB7" font-size="17">Roulette</text>
    <text x="88" y="504" fill="#A6ADB7" font-size="17">Contacts · Saved</text>

    <rect x="260" y="370" width="190" height="168" rx="16" fill="#24272C"/>
    <text x="278" y="403" fill="#F7F8FA" font-size="20" font-weight="680">ConversationList</text>
    <text x="278" y="432" fill="#A6ADB7" font-size="17">search + select</text>
    <text x="278" y="456" fill="#A6ADB7" font-size="17">direct + group</text>
    <text x="278" y="480" fill="#A6ADB7" font-size="17">Burner rooms</text>
    <text x="278" y="504" fill="#A6ADB7" font-size="17">row actions</text>

    <rect x="468" y="370" width="410" height="168" rx="16" fill="#24272C"/>
    <text x="486" y="403" fill="#F7F8FA" font-size="20" font-weight="680">Workspace</text>
    <rect x="486" y="420" width="166" height="92" rx="16" fill="#17191D" stroke="#343940"/>
    <text x="504" y="451" fill="#F7F8FA" font-size="19" font-weight="650">ChatPane</text>
    <text x="504" y="478" fill="#A6ADB7" font-size="17">history + composer</text>
    <text x="504" y="500" fill="#A6ADB7" font-size="17">message actions</text>
    <rect x="670" y="420" width="190" height="92" rx="16" fill="#17191D" stroke="#343940"/>
    <text x="688" y="451" fill="#F7F8FA" font-size="19" font-weight="650">Operational panes</text>
    <text x="688" y="478" fill="#A6ADB7" font-size="17">Wiretap · Roulette</text>
    <text x="688" y="500" fill="#A6ADB7" font-size="17">Contacts · Status</text>

    <rect x="896" y="370" width="234" height="168" rx="16" fill="#24272C"/>
    <text x="914" y="403" fill="#F7F8FA" font-size="20" font-weight="680">Inspector</text>
    <text x="914" y="432" fill="#A6ADB7" font-size="17">privacy score</text>
    <text x="914" y="456" fill="#A6ADB7" font-size="17">active readers</text>
    <text x="914" y="480" fill="#A6ADB7" font-size="17">route trace</text>
    <rect x="914" y="494" width="118" height="26" rx="13" fill="#2A1617"/>
    <text x="929" y="513" fill="#FF7B72" font-size="16">EXPOSED</text>
  </g>
  <g fill="#A6ADB7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">
    <text x="48" y="601">STATE FLOWS DOWN · INTENTS FLOW THROUGH KNOTCONTROLLER · TRANSPORT STAYS OUTSIDE REACT</text>
  </g>
</svg>
