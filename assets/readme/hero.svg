    <text x="48" y="214" fill="#F7F8FA" font-size="72" font-weight="760" letter-spacing="-3">UNSECURE</text>
    <text x="52" y="260" fill="#A6ADB7" font-size="24">A deliberately exposed messenger.</text>
    <rect x="48" y="292" width="234" height="42" rx="16" fill="#2A1617" stroke="#FF5D52"/>
    <text x="68" y="320" fill="#FF7B72" font-size="20" font-weight="650">EXPOSED · 0 / 100</text>
  </g>
  <g transform="translate(648 82)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect width="504" height="246" rx="16" fill="#17191D" stroke="#343940"/>
    <text x="24" y="35" fill="#A6ADB7" font-size="18" font-weight="600">MESSAGE ROUTE</text>
    <rect x="24" y="54" width="456" height="54" rx="16" fill="#F7F8FA"/>
    <text x="44" y="88" fill="#101114" font-size="20" font-weight="600">The server can absolutely read this.</text>
    <g transform="translate(24 134)">
      <rect width="126" height="46" rx="16" fill="#24272C" stroke="#424852"/>
      <rect x="165" width="126" height="46" rx="16" fill="#24272C" stroke="#424852"/>
      <rect x="330" width="126" height="46" rx="16" fill="#24272C" stroke="#424852"/>
      <text x="24" y="30" fill="#F7F8FA" font-size="19" font-weight="650">gateway</text>
      <text x="202" y="30" fill="#F7F8FA" font-size="19" font-weight="650">router</text>
      <text x="348" y="30" fill="#F7F8FA" font-size="19" font-weight="650">delivery</text>
      <path d="M132 23H157M297 23H322" stroke="#69717D" stroke-width="2" marker-end="url(#arrow)"/>
    </g>
    <rect x="24" y="198" width="456" height="30" rx="15" fill="#2A1617"/>
    <circle cx="43" cy="213" r="5" fill="#FF5D52"/>
    <text x="57" y="220" fill="#FF7B72" font-size="18" font-weight="650">ORIGINAL RETAINED IN WIRETAP</text>
  </g>
  <g fill="#A6ADB7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">
