<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Knot Unsecure</title>
  <desc id="desc">A deliberately exposed messenger with a plaintext message passing through gateway, router and delivery into the permanent Wiretap.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#69717D"/>
    </marker>
  </defs>
  <rect width="1200" height="420" rx="24" fill="#0C0D0F"/>
  <path d="M48 58H1152M48 362H1152" stroke="#343940"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="1.4">
    <text x="48" y="38" fill="#A6ADB7">KNOT / PRIVACY ANTI-PATTERN / 00</text>
    <circle cx="916" cy="31" r="6" fill="#2CCB7F"/>
    <text x="932" y="38" fill="#F7F8FA">SERVER IS LISTENING</text>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
