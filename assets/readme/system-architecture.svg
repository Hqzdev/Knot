<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Knot system architecture</title>
  <desc id="desc">The browser crosses the web edge into API, Gateway, Router, Delivery, Presence, Attachments, Preview and Toxic Support, backed by PostgreSQL, Redis, NATS and MinIO.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#69717D"/>
    </marker>
  </defs>
  <rect width="1200" height="660" rx="24" fill="#0C0D0F"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="48" y="58" fill="#F7F8FA" font-size="40" font-weight="720">System architecture</text>
    <text x="48" y="88" fill="#A6ADB7" font-size="20">One public origin, focused services, deliberately readable state.</text>
  </g>
  <g fill="#A6ADB7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="1.2">
    <text x="48" y="136">CLIENT</text>
    <text x="302" y="136">EDGE</text>
    <text x="520" y="136">SERVICE FABRIC</text>
    <text x="946" y="136">STATE</text>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="48" y="158" width="208" height="438" rx="16" fill="#17191D" stroke="#343940"/>
    <text x="70" y="194" fill="#F7F8FA" font-size="24" font-weight="680">Browser</text>
    <text x="70" y="222" fill="#A6ADB7" font-size="18">HTTP + WebSocket</text>
    <rect x="70" y="250" width="164" height="64" rx="16" fill="#24272C"/>
    <text x="88" y="278" fill="#F7F8FA" font-size="20" font-weight="650">Control Room</text>
    <text x="88" y="301" fill="#A6ADB7" font-size="17">React interface</text>
    <rect x="70" y="332" width="164" height="82" rx="16" fill="#24272C"/>
    <text x="88" y="362" fill="#F7F8FA" font-size="20" font-weight="650">PlainRepository</text>
    <text x="88" y="386" fill="#A6ADB7" font-size="17">session · cache</text>
    <text x="88" y="407" fill="#A6ADB7" font-size="17">outbox · device ID</text>
    <rect x="70" y="432" width="164" height="64" rx="16" fill="#24272C"/>
    <text x="88" y="460" fill="#F7F8FA" font-size="20" font-weight="650">Public site</text>
    <text x="88" y="483" fill="#A6ADB7" font-size="17">research pages</text>

    <rect x="302" y="158" width="170" height="438" rx="16" fill="#17191D" stroke="#343940"/>
    <text x="324" y="194" fill="#F7F8FA" font-size="24" font-weight="680">Web edge</text>
    <rect x="324" y="250" width="126" height="64" rx="16" fill="#24272C"/>
    <text x="346" y="278" fill="#F7F8FA" font-size="20" font-weight="650">Nginx</text>
    <text x="346" y="301" fill="#A6ADB7" font-size="17">same origin</text>
    <rect x="324" y="332" width="126" height="64" rx="16" fill="#24272C"/>
    <text x="346" y="360" fill="#F7F8FA" font-size="20" font-weight="650">Next.js</text>
    <text x="346" y="383" fill="#A6ADB7" font-size="17">web app</text>
    <rect x="324" y="414" width="126" height="82" rx="16" fill="#2A1617" stroke="#FF5D52"/>
    <text x="346" y="444" fill="#FF7B72" font-size="20" font-weight="650">No TLS</text>
    <text x="346" y="468" fill="#FF7B72" font-size="17">no origin gate</text>
    <text x="346" y="489" fill="#FF7B72" font-size="17">no privacy</text>

    <rect x="520" y="158" width="378" height="438" rx="16" fill="#17191D" stroke="#343940"/>
    <rect x="542" y="186" width="150" height="62" rx="16" fill="#24272C"/>
    <text x="562" y="214" fill="#F7F8FA" font-size="20" font-weight="650">API</text>
    <text x="562" y="237" fill="#A6ADB7" font-size="17">identity</text>
    <rect x="724" y="186" width="150" height="62" rx="16" fill="#24272C"/>
    <text x="744" y="214" fill="#F7F8FA" font-size="20" font-weight="650">Gateway</text>
    <text x="744" y="237" fill="#A6ADB7" font-size="17">public socket</text>
    <rect x="542" y="270" width="150" height="62" rx="16" fill="#24272C"/>
    <text x="562" y="298" fill="#F7F8FA" font-size="20" font-weight="650">Router</text>
    <text x="562" y="321" fill="#A6ADB7" font-size="17">authorization</text>
    <rect x="724" y="270" width="150" height="62" rx="16" fill="#24272C"/>
    <text x="744" y="298" fill="#F7F8FA" font-size="20" font-weight="650">Delivery</text>
    <text x="744" y="321" fill="#A6ADB7" font-size="17">permanent record</text>
    <rect x="542" y="354" width="150" height="62" rx="16" fill="#24272C"/>
    <text x="562" y="382" fill="#F7F8FA" font-size="20" font-weight="650">Presence</text>
    <text x="562" y="405" fill="#A6ADB7" font-size="17">drafts · watchers</text>
    <rect x="724" y="354" width="150" height="62" rx="16" fill="#24272C"/>
    <text x="744" y="382" fill="#F7F8FA" font-size="20" font-weight="650">Attachments</text>
    <text x="744" y="405" fill="#A6ADB7" font-size="17">public files</text>
    <rect x="542" y="438" width="150" height="62" rx="16" fill="#24272C"/>
    <text x="562" y="466" fill="#F7F8FA" font-size="20" font-weight="650">Preview</text>
    <text x="562" y="489" fill="#A6ADB7" font-size="17">bounded fetch</text>
    <rect x="724" y="438" width="150" height="62" rx="16" fill="#24272C"/>
    <text x="744" y="466" fill="#F7F8FA" font-size="20" font-weight="650">Toxic Support</text>
    <text x="744" y="489" fill="#A6ADB7" font-size="17">system replies</text>
    <rect x="542" y="522" width="332" height="48" rx="16" fill="#24272C"/>
    <text x="565" y="553" fill="#A6ADB7" font-size="18">internal gRPC · shared service token</text>

    <rect x="946" y="158" width="206" height="438" rx="16" fill="#17191D" stroke="#343940"/>
    <rect x="968" y="186" width="162" height="72" rx="16" fill="#24272C"/>
    <text x="988" y="216" fill="#F7F8FA" font-size="20" font-weight="650">PostgreSQL</text>
    <text x="988" y="240" fill="#A6ADB7" font-size="17">permanent truth</text>
    <rect x="968" y="280" width="162" height="72" rx="16" fill="#24272C"/>
    <text x="988" y="310" fill="#F7F8FA" font-size="20" font-weight="650">Redis</text>
    <text x="988" y="334" fill="#A6ADB7" font-size="17">expiring state</text>
    <rect x="968" y="374" width="162" height="72" rx="16" fill="#24272C"/>
    <text x="988" y="404" fill="#F7F8FA" font-size="20" font-weight="650">NATS</text>
    <text x="988" y="428" fill="#A6ADB7" font-size="17">Wiretap events</text>
    <rect x="968" y="468" width="162" height="72" rx="16" fill="#24272C"/>
    <text x="988" y="498" fill="#F7F8FA" font-size="20" font-weight="650">MinIO</text>
    <text x="988" y="522" fill="#A6ADB7" font-size="17">public bytes</text>
  </g>
  <g fill="none" stroke="#69717D" stroke-width="2" marker-end="url(#arrow)">
    <path d="M256 282H294"/>
    <path d="M472 282H510"/>
    <path d="M744 248V258H674V262"/>
    <path d="M692 301H716"/>
    <path d="M692 217H920V222H938"/>
    <path d="M874 301H910V246H938"/>
    <path d="M692 385H910V316H938"/>
    <path d="M874 385H922V504H938"/>
    <path d="M938 410H900V469H882"/>
  </g>
  <path d="M874 301H920V410H938" fill="none" stroke="#FF5D52" stroke-width="2" marker-end="url(#arrow)"/>
  <g fill="#A6ADB7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">
    <text x="48" y="632">PERMANENT CONTENT: POSTGRES + MINIO</text>
    <text x="760" y="632">EPHEMERAL COORDINATION: REDIS</text>
  </g>
</svg>
