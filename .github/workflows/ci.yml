name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - run: cargo check --target wasm32-unknown-unknown -p knot-crypto-core

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: knot_test
          POSTGRES_USER: knot
          POSTGRES_PASSWORD: knot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U knot -d knot_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      KNOT_TEST_DATABASE_URL: postgres://knot:knot@127.0.0.1:5432/knot_test?sslmode=disable
      KNOT_TEST_ATTACHMENTS_DATABASE_URL: postgres://knot:knot@127.0.0.1:5432/knot_test?sslmode=disable
      KNOT_PUSH_TEST_DATABASE_URL: postgres://knot:knot@127.0.0.1:5432/knot_test?sslmode=disable
      KNOT_TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: bufbuild/buf-setup-action@v1
      - run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - run: buf lint proto
      - run: go test -race ./...
      - run: go vet ./...

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clients/web/package-lock.json
      - run: cargo install wasm-pack --version 0.15.0 --locked
      - run: npm ci
        working-directory: clients/web
      - run: npm run check
        working-directory: clients/web

  apple:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/build_ios_xcframework.sh
      - run: xcodebuild -project clients/apple/Knot/Knot.xcodeproj -scheme Knot -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - run: xcodebuild -project clients/apple/Knot/Knot.xcodeproj -scheme Knot -configuration Debug -destination 'generic/platform=macOS' CODE_SIGNING_ALLOWED=NO build

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: services/api/Dockerfile
          - name: attachments
            dockerfile: services/attachments/Dockerfile
          - name: delivery
            dockerfile: services/delivery/Dockerfile
          - name: gateway
            dockerfile: services/gateway/Dockerfile
          - name: presence
            dockerfile: services/presence/Dockerfile
          - name: push
            dockerfile: services/push/Dockerfile
          - name: router
            dockerfile: services/router/Dockerfile
          - name: web
            dockerfile: clients/web/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: knot-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
