name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: knot_attachments_test
          POSTGRES_USER: knot
          POSTGRES_PASSWORD: knot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U knot -d knot_attachments_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      KNOT_TEST_ATTACHMENTS_DATABASE_URL: postgres://knot:knot@127.0.0.1:5432/knot_attachments_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: bufbuild/buf-setup-action@v1
      - run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - run: buf lint proto
      - run: ./scripts/check_plaintext_product.sh
      - run: go test -race ./...
      - run: go vet ./...

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clients/web/package-lock.json
      - run: npm ci
        working-directory: clients/web
      - run: npm run check
        working-directory: clients/web

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clients/web/package-lock.json
      - run: npm ci
        working-directory: clients/web
      - run: npx playwright install --with-deps chromium
        working-directory: clients/web
      - run: |
          npm run dev >/tmp/knot-web.log 2>&1 &
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:5173 >/dev/null && break
            sleep 1
          done
          npm run test:e2e
        working-directory: clients/web

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: services/api/Dockerfile
          - name: attachments
            dockerfile: services/attachments/Dockerfile
          - name: delivery
            dockerfile: services/delivery/Dockerfile
          - name: gateway
            dockerfile: services/gateway/Dockerfile
          - name: presence
            dockerfile: services/presence/Dockerfile
          - name: preview
            dockerfile: services/preview/Dockerfile
          - name: router
            dockerfile: services/router/Dockerfile
          - name: web
            dockerfile: clients/web/Dockerfile
          - name: web-proxy
            dockerfile: clients/web/nginx/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: knot-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
