apiVersion: apps/v1
kind: Deployment
metadata:
  name: attachments
  labels:
    app.kubernetes.io/name: attachments
    app.kubernetes.io/part-of: knot
spec:
  replicas: 2
  minReadySeconds: 5
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: attachments
  template:
    metadata:
      labels:
        app.kubernetes.io/name: attachments
        app.kubernetes.io/part-of: knot
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: attachments
          image: ghcr.io/hqzdev/knot-attachments:main
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8082
              protocol: TCP
          env:
            - name: KNOT_ATTACHMENTS_ADDRESS
              value: :8082
            - name: KNOT_ATTACHMENTS_STORE
              value: postgres
            - name: KNOT_ATTACHMENTS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: knot-runtime-secrets
                  key: KNOT_ATTACHMENTS_DATABASE_URL
            - name: KNOT_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: knot-runtime-secrets
                  key: KNOT_JWT_SECRET
            - name: KNOT_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: knot-runtime-secrets
                  key: KNOT_S3_ACCESS_KEY_ID
            - name: KNOT_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: knot-runtime-secrets
                  key: KNOT_S3_SECRET_ACCESS_KEY
            - name: KNOT_S3_SESSION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: knot-runtime-secrets
                  key: KNOT_S3_SESSION_TOKEN
                  optional: true
            - name: KNOT_S3_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: knot-runtime-config
                  key: KNOT_S3_ENDPOINT
            - name: KNOT_S3_PUBLIC_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: knot-runtime-config
                  key: KNOT_S3_PUBLIC_ENDPOINT
            - name: KNOT_S3_REGION
              valueFrom:
                configMapKeyRef:
                  name: knot-runtime-config
                  key: KNOT_S3_REGION
            - name: KNOT_S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: knot-runtime-config
                  key: KNOT_S3_BUCKET
            - name: KNOT_S3_PATH_STYLE
              valueFrom:
                configMapKeyRef:
                  name: knot-runtime-config
                  key: KNOT_S3_PATH_STYLE
            - name: KNOT_CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: knot-runtime-config
                  key: KNOT_CORS_ORIGINS
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: knot-runtime-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
            - name: OTEL_SERVICE_NAME
              value: knot-attachments
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: attachments
  labels:
    app.kubernetes.io/name: attachments
    app.kubernetes.io/part-of: knot
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: attachments
  ports:
    - name: http
      port: 8082
      targetPort: http
      protocol: TCP
