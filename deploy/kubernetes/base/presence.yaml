apiVersion: apps/v1
kind: Deployment
metadata:
  name: presence
  labels:
    app.kubernetes.io/name: presence
    app.kubernetes.io/part-of: knot
spec:
  replicas: 2
  minReadySeconds: 5
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: presence
  template:
    metadata:
      labels:
        app.kubernetes.io/name: presence
        app.kubernetes.io/part-of: knot
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: presence
          image: ghcr.io/hqzdev/knot-presence:main
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          env:
            - name: KNOT_PRESENCE_ADDRESS
              value: :8081
            - name: KNOT_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: knot-runtime-secrets
                  key: KNOT_REDIS_URL
            - name: KNOT_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: knot-runtime-secrets
                  key: KNOT_JWT_SECRET
            - name: KNOT_CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: knot-runtime-config
                  key: KNOT_CORS_ORIGINS
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: knot-runtime-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
            - name: OTEL_SERVICE_NAME
              value: knot-presence
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: presence
  labels:
    app.kubernetes.io/name: presence
    app.kubernetes.io/part-of: knot
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: presence
  ports:
    - name: http
      port: 8081
      targetPort: http
      protocol: TCP
