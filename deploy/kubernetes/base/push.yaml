apiVersion: apps/v1
kind: Deployment
metadata:
  name: push
  labels:
    app.kubernetes.io/name: push
    app.kubernetes.io/part-of: knot
spec:
  replicas: 2
  minReadySeconds: 5
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: push
  template:
    metadata:
      labels:
        app.kubernetes.io/name: push
        app.kubernetes.io/part-of: knot
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: push
          image: ghcr.io/hqzdev/knot-push:main
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8083
              protocol: TCP
          env:
            - name: KNOT_PUSH_ADDRESS
              value: :8083
            - name: KNOT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: knot-runtime-secrets
                  key: KNOT_DATABASE_URL
            - name: KNOT_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: knot-runtime-secrets
                  key: KNOT_JWT_SECRET
            - name: KNOT_PUSH_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: knot-runtime-secrets
                  key: KNOT_PUSH_INTERNAL_TOKEN
            - name: KNOT_WEB_PUSH_VAPID_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: knot-runtime-secrets
                  key: KNOT_WEB_PUSH_VAPID_PRIVATE_KEY
            - name: KNOT_PUSH_PROVIDER_MODE
              valueFrom:
                configMapKeyRef:
                  name: knot-runtime-config
                  key: KNOT_PUSH_PROVIDER_MODE
            - name: KNOT_APNS_PRIVATE_KEY_FILE
              value: /var/run/secrets/knot/apns/apns-private-key.p8
            - name: KNOT_APNS_KEY_ID
              valueFrom:
                configMapKeyRef:
                  name: knot-runtime-config
                  key: KNOT_APNS_KEY_ID
            - name: KNOT_APNS_TEAM_ID
              valueFrom:
                configMapKeyRef:
                  name: knot-runtime-config
                  key: KNOT_APNS_TEAM_ID
            - name: KNOT_APNS_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: knot-runtime-config
                  key: KNOT_APNS_TOPIC
            - name: KNOT_APNS_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: knot-runtime-config
                  key: KNOT_APNS_ENVIRONMENT
            - name: KNOT_WEB_PUSH_VAPID_PUBLIC_KEY
              valueFrom:
                configMapKeyRef:
                  name: knot-runtime-config
                  key: KNOT_WEB_PUSH_VAPID_PUBLIC_KEY
            - name: KNOT_WEB_PUSH_SUBJECT
              valueFrom:
                configMapKeyRef:
                  name: knot-runtime-config
                  key: KNOT_WEB_PUSH_SUBJECT
            - name: KNOT_CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: knot-runtime-config
                  key: KNOT_CORS_ORIGINS
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: knot-runtime-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
            - name: OTEL_SERVICE_NAME
              value: knot-push
          volumeMounts:
            - name: apns-private-key
              mountPath: /var/run/secrets/knot/apns
              readOnly: true
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: apns-private-key
          secret:
            secretName: knot-runtime-secrets
            defaultMode: 0440
            items:
              - key: KNOT_APNS_PRIVATE_KEY
                path: apns-private-key.p8
---
apiVersion: v1
kind: Service
metadata:
  name: push
  labels:
    app.kubernetes.io/name: push
    app.kubernetes.io/part-of: knot
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: push
  ports:
    - name: http
      port: 8083
      targetPort: http
      protocol: TCP
