apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: knot
spec:
  replicas: 2
  minReadySeconds: 5
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: knot
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/hqzdev/knot-api:main
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: KNOT_API_ADDRESS
              value: :8080
            - name: KNOT_PUSH_INTERNAL_URL
              value: http://push:8083
            - name: KNOT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: knot-runtime-secrets
                  key: KNOT_DATABASE_URL
            - name: KNOT_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: knot-runtime-secrets
                  key: KNOT_REDIS_URL
            - name: KNOT_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: knot-runtime-secrets
                  key: KNOT_JWT_SECRET
            - name: KNOT_PUSH_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: knot-runtime-secrets
                  key: KNOT_PUSH_INTERNAL_TOKEN
            - name: KNOT_CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: knot-runtime-config
                  key: KNOT_CORS_ORIGINS
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: knot-runtime-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
            - name: OTEL_SERVICE_NAME
              value: knot-api
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: knot
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
