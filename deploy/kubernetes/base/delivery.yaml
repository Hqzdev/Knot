apiVersion: apps/v1
kind: Deployment
metadata:
  name: delivery
  labels:
    app.kubernetes.io/name: delivery
    app.kubernetes.io/part-of: knot
spec:
  replicas: 2
  minReadySeconds: 5
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: delivery
  template:
    metadata:
      labels:
        app.kubernetes.io/name: delivery
        app.kubernetes.io/part-of: knot
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: delivery
          image: ghcr.io/hqzdev/knot-delivery:main
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          ports:
            - name: grpc
              containerPort: 9092
              protocol: TCP
            - name: health
              containerPort: 8085
              protocol: TCP
          env:
            - name: KNOT_DELIVERY_GRPC_ADDRESS
              value: :9092
            - name: KNOT_DELIVERY_HEALTH_ADDRESS
              value: :8085
            - name: KNOT_DELIVERY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: knot-runtime-secrets
                  key: KNOT_DELIVERY_DATABASE_URL
            - name: KNOT_NATS_URL
              valueFrom:
                secretKeyRef:
                  name: knot-runtime-secrets
                  key: KNOT_NATS_URL
            - name: KNOT_INTERNAL_GRPC_TOKEN
              valueFrom:
                secretKeyRef:
                  name: knot-runtime-secrets
                  key: KNOT_INTERNAL_GRPC_TOKEN
            - name: KNOT_DELIVERY_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: knot-runtime-secrets
                  key: KNOT_DELIVERY_TOKEN_SECRET
            - name: KNOT_NATS_REPLICAS
              valueFrom:
                configMapKeyRef:
                  name: knot-runtime-config
                  key: KNOT_NATS_REPLICAS
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: knot-runtime-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
            - name: OTEL_SERVICE_NAME
              value: knot-delivery
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: delivery
  labels:
    app.kubernetes.io/name: delivery
    app.kubernetes.io/part-of: knot
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: delivery
  ports:
    - name: grpc
      port: 9092
      targetPort: grpc
      protocol: TCP
