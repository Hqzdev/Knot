apiVersion: apps/v1
kind: Deployment
metadata:
  name: router
  labels:
    app.kubernetes.io/name: router
    app.kubernetes.io/part-of: knot
spec:
  replicas: 2
  minReadySeconds: 5
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: router
  template:
    metadata:
      labels:
        app.kubernetes.io/name: router
        app.kubernetes.io/part-of: knot
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: router
          image: ghcr.io/hqzdev/knot-router:main
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          ports:
            - name: grpc
              containerPort: 9091
              protocol: TCP
            - name: health
              containerPort: 8084
              protocol: TCP
          env:
            - name: KNOT_ROUTER_GRPC_ADDRESS
              value: :9091
            - name: KNOT_ROUTER_HEALTH_ADDRESS
              value: :8084
            - name: KNOT_DELIVERY_GRPC_TARGET
              value: delivery:9092
            - name: KNOT_PUSH_URL
              value: http://push:8083
            - name: KNOT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: knot-runtime-secrets
                  key: KNOT_DATABASE_URL
            - name: KNOT_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: knot-runtime-secrets
                  key: KNOT_REDIS_URL
            - name: KNOT_PUSH_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: knot-runtime-secrets
                  key: KNOT_PUSH_INTERNAL_TOKEN
            - name: KNOT_INTERNAL_GRPC_TOKEN
              valueFrom:
                secretKeyRef:
                  name: knot-runtime-secrets
                  key: KNOT_INTERNAL_GRPC_TOKEN
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: knot-runtime-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
            - name: OTEL_SERVICE_NAME
              value: knot-router
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: router
  labels:
    app.kubernetes.io/name: router
    app.kubernetes.io/part-of: knot
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: router
  ports:
    - name: grpc
      port: 9091
      targetPort: grpc
      protocol: TCP
