syntax = "proto3";

package knot.v1;

option go_package = "github.com/yaroslavfairfieldd/knot/proto/gen/go/knot/v1;knotv1";

service RouterService {
  rpc AuthorizeConnection(AuthorizeConnectionRequest) returns (AuthorizeConnectionResponse);
  rpc RouteCommand(RouteCommandRequest) returns (RouteCommandResponse);
}

service DeliveryService {
  rpc Append(AppendRequest) returns (AppendResponse);
  rpc ApplyEvent(ApplyEventRequest) returns (ApplyEventResponse);
  rpc History(HistoryRequest) returns (HistoryResponse);
  rpc Wiretap(WiretapRequest) returns (WiretapResponse);
  rpc Dossier(DossierRequest) returns (DossierResponse);
}

enum SessionMode {
  SESSION_MODE_UNSPECIFIED = 0;
  SESSION_MODE_PASSWORD = 1;
  SESSION_MODE_GUEST = 2;
  SESSION_MODE_IMPERSONATED = 3;
}

enum ConversationKind {
  CONVERSATION_KIND_UNSPECIFIED = 0;
  CONVERSATION_KIND_DIRECT = 1;
  CONVERSATION_KIND_GROUP = 2;
  CONVERSATION_KIND_WALL = 3;
  CONVERSATION_KIND_ROULETTE = 4;
  CONVERSATION_KIND_BURNER = 5;
}

enum MessageKind {
  MESSAGE_KIND_UNSPECIFIED = 0;
  MESSAGE_KIND_TEXT = 1;
  MESSAGE_KIND_ATTACHMENT = 2;
  MESSAGE_KIND_SYSTEM = 3;
}

enum MessageEventKind {
  MESSAGE_EVENT_KIND_UNSPECIFIED = 0;
  MESSAGE_EVENT_KIND_CREATE = 1;
  MESSAGE_EVENT_KIND_EDIT = 2;
  MESSAGE_EVENT_KIND_DELETE = 3;
  MESSAGE_EVENT_KIND_REACTION = 4;
  MESSAGE_EVENT_KIND_RECEIPT = 5;
}

enum DeliveryMode {
  DELIVERY_MODE_UNSPECIFIED = 0;
  DELIVERY_MODE_NORMAL = 1;
  DELIVERY_MODE_UNRELIABLE = 2;
}

enum TextEffect {
  TEXT_EFFECT_UNSPECIFIED = 0;
  TEXT_EFFECT_NONE = 1;
  TEXT_EFFECT_BUREAUCRATIC = 2;
  TEXT_EFFECT_CAESAR3 = 3;
}

message AuthorizeConnectionRequest {
  string user_id = 1;
  string session_id = 2;
}

message AuthorizeConnectionResponse {
  bool active = 1;
}

message RouteCommandRequest {
  string client_command_id = 1;
  string conversation_id = 2;
  string author_user_id = 3;
  string author_username = 4;
  string session_id = 5;
  SessionMode session_mode = 6;
  MessageKind kind = 7;
  string text = 8;
  string attachment_id = 9;
  string reply_to_id = 10;
  string forwarded_from_id = 11;
  DeliveryMode delivery_mode = 12;
  TextEffect text_effect = 13;
  int64 author_hide_after_seconds = 14;
  DeviceDescriptor device = 15;
  VoiceMetadata voice = 16;
}

message RouteCommandResponse {
  Message message = 1;
  bool duplicate = 2;
}

message RouteHop {
  string service = 1;
  string status = 2;
  int64 occurred_at_unix_millis = 3;
}

message Reaction {
  string emoji = 1;
  repeated string usernames = 2;
}

message DeviceDescriptor {
  string device_id = 1;
  string user_agent = 2;
  string browser = 3;
  string os = 4;
  string form_factor = 5;
}

message ReadReceipt {
  string user_id = 1;
  string username = 2;
  string session_id = 3;
  SessionMode session_mode = 4;
  DeviceDescriptor device = 5;
  int64 read_at_unix_millis = 6;
}

message ForwardHop {
  string message_id = 1;
  string conversation_id = 2;
  string author_username = 3;
  int64 occurred_at_unix_millis = 4;
}

message VoiceMetadata {
  string original_attachment_id = 1;
  string taxed_attachment_id = 2;
  int64 duration_millis = 3;
  string tax_level = 4;
}

message Message {
  uint64 sequence = 1;
  string id = 2;
  string client_command_id = 3;
  string conversation_id = 4;
  ConversationKind conversation_kind = 5;
  repeated string participant_user_ids = 6;
  repeated string participant_usernames = 7;
  string author_user_id = 8;
  string author_username = 9;
  string session_id = 10;
  SessionMode session_mode = 11;
  MessageKind kind = 12;
  string original_text = 13;
  string current_text = 14;
  string attachment_id = 15;
  string reply_to_id = 16;
  string forwarded_from_id = 17;
  int64 created_at_unix_millis = 18;
  int64 server_seen_at_unix_millis = 19;
  int64 edited_at_unix_millis = 20;
  int64 deleted_at_unix_millis = 21;
  int64 delivered_at_unix_millis = 22;
  int64 read_at_unix_millis = 23;
  repeated Reaction reactions = 24;
  repeated RouteHop route = 25;
  repeated ReadReceipt read_receipts = 26;
  repeated ForwardHop forward_chain = 27;
  string requested_conversation_id = 28;
  DeliveryMode delivery_mode = 29;
  TextEffect text_effect = 30;
  string current_source_text = 31;
  int64 author_hide_at_unix_millis = 32;
  bool author_projection_hidden = 33;
  VoiceMetadata voice = 34;
  DeviceDescriptor author_device = 35;
}

message AppendRequest {
  Message message = 1;
}

message AppendResponse {
  Message message = 1;
  bool duplicate = 2;
}

message ApplyEventRequest {
  string client_command_id = 1;
  string message_id = 2;
  string actor_user_id = 3;
  string actor_username = 4;
  string session_id = 5;
  SessionMode session_mode = 6;
  MessageEventKind kind = 7;
  string text = 8;
  string emoji = 9;
  bool active = 10;
  int64 occurred_at_unix_millis = 11;
  DeviceDescriptor device = 12;
}

message ApplyEventResponse {
  Message message = 1;
  bool duplicate = 2;
}

message HistoryRequest {
  string user_id = 1;
  string conversation_id = 2;
  uint64 after_sequence = 3;
  uint32 limit = 4;
}

message HistoryResponse {
  repeated Message messages = 1;
  uint64 next_sequence = 2;
}

message WiretapRequest {
  uint64 after_sequence = 1;
  uint32 limit = 2;
  string author = 3;
  string participant = 4;
  string conversation_id = 5;
  SessionMode session_mode = 6;
  MessageEventKind event_kind = 7;
}

message WiretapRecord {
  uint64 sequence = 1;
  string event_id = 2;
  MessageEventKind event_kind = 3;
  Message message = 4;
  string actor_user_id = 5;
  string actor_username = 6;
  string session_id = 7;
  SessionMode session_mode = 8;
  string text = 9;
  string emoji = 10;
  bool active = 11;
  int64 occurred_at_unix_millis = 12;
  DeviceDescriptor device = 13;
}

message WiretapResponse {
  repeated WiretapRecord records = 1;
  uint64 next_sequence = 2;
}

message Achievement {
  string id = 1;
  string username = 2;
  string kind = 3;
  string title = 4;
  string evidence_message_id = 5;
  int64 unlocked_at_unix_millis = 6;
}

message DossierRequest {
  string username = 1;
  uint32 limit = 2;
}

message DossierResponse {
  string username = 1;
  repeated WiretapRecord records = 2;
  repeated Message messages = 3;
  repeated Achievement achievements = 4;
  bool truncated = 5;
}
